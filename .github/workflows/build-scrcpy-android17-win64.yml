name: Build scrcpy Android 17 (Windows x64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrcpy-android17-win64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win64:
    name: Build patched Windows x64 package
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VERSION: 5.0.1-android17-pr7127
      GRADLE: ./gradlew

    steps:
      - name: Checkout PR #7127 patched source
        uses: actions/checkout@v6
        with:
          repository: KimGLee/scrcpy
          # PR #7127 head commit as of 2026-11-24; pin for reproducibility.
          ref: 007dfd8a7e4e1a2b218b6957f6f1198792b0d195
          path: scrcpy-src
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Windows cross-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential cmake curl file git libtool \
            libz-mingw-w64-dev make meson mingw-w64 mingw-w64-tools \
            nasm ninja-build pkg-config unzip wget zip

      - name: Install Android SDK platform required by scrcpy-server
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Build patched Android server
        working-directory: scrcpy-src
        shell: bash
        run: release/build_server.sh

      - name: Build portable Windows x64 client
        working-directory: scrcpy-src
        shell: bash
        run: release/build_windows.sh 64

      - name: Package matching client and server
        working-directory: scrcpy-src
        shell: bash
        run: release/package_client.sh win64 zip

      - name: Verify package contents and patched option
        working-directory: scrcpy-src
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="release/output/scrcpy-win64-${VERSION}.zip"
          CLIENT="release/work/build-win64/dist/scrcpy.exe"
          SERVER="release/work/build-server/server/scrcpy-server"

          test -s "$CLIENT"
          test -s "$SERVER"
          test -s "$PACKAGE"
          grep -F -- '--vd-enable-freeform' app/src/cli.c
          strings "$CLIENT" | grep -F -- '--vd-enable-freeform'
          file "$CLIENT"
          x86_64-w64-mingw32-objdump -f "$CLIENT" | grep -E 'pei-x86-64|architecture: i386:x86-64'
          unzip -l "$PACKAGE" | grep -E 'scrcpy.exe|scrcpy-server|adb.exe|SDL3.dll'

      - name: Upload portable Windows x64 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-android17-windows-x64
          path: scrcpy-src/release/output/scrcpy-win64-5.0.1-android17-pr7127.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
