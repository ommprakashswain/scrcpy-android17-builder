name: Build scrcpy Android 17 Win64
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version tag'
        required: true
        default: 'v5.0.1-android17'

jobs:
  build-win64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 meson ninja-build pkg-config cmake nasm zip curl
      - name: Build server and Win64 package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./release/build_server.sh
          ./release/build_windows.sh 64
          ./release/package_client.sh win64 zip
      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-win64-${{ inputs.version }}
          path: release/**/*.zip
