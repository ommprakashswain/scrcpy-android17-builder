name: FULL BUILD - scrcpy Android 17 (Windows x64)

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrcpy-android17-win64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win64:
    name: Download sources, build and package Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: 5.0.1-android17-pr7127
      PATCH_URL: https://codeload.github.com/KimGLee/scrcpy/zip/refs/heads/fix/android17-virtual-display-launch
      ORIGINAL_URL: https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip
      # SHA-256 values of the exact two archives previously supplied in this chat.
      # The original is the official scrcpy v5.0.1 Windows x64 release archive.
      PATCH_SHA256: e35559a5947a6bf85638e19eba66cc06631965ded9ba978bd313beb54c8d783b
      ORIGINAL_SHA256: b12a2c4ee8be317422451fc7dcf8ee20a71b5ea7ef9ad73ddd825a25316227a5

    steps:
      - name: Install native Windows cross-compilation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint binutils build-essential cmake curl \
            file gettext git libtool libtool-bin libz-mingw-w64-dev make \
            meson mingw-w64 mingw-w64-tools nasm ninja-build perl pkg-config \
            python3 unzip wget zip

      - name: Set up Java 17 for the Android server
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages required by this source
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Download BOTH source archives directly from their URLs
        id: download-sources
        shell: bash
        run: |
          set -euo pipefail

          PATCH_ZIP="$RUNNER_TEMP/scrcpy-fix-android17-virtual-display-launch.zip"
          ORIGINAL_ZIP="$RUNNER_TEMP/scrcpy-win64-v5.0.1.zip"
          PATCH_UNPACK="$RUNNER_TEMP/patch-source"
          ORIGINAL_UNPACK="$RUNNER_TEMP/original-release"

          echo "Downloading patched source from: $PATCH_URL"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            "$PATCH_URL" --output "$PATCH_ZIP"

          echo "Downloading official original Windows package from: $ORIGINAL_URL"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            "$ORIGINAL_URL" --output "$ORIGINAL_ZIP"

          echo "$PATCH_SHA256  $PATCH_ZIP" | sha256sum --check --status || {
            echo "ERROR: The downloaded patch archive does not match the supplied PR #7127 ZIP checksum."
            echo "The upstream branch may have changed since the archive was inspected. Review the new source before updating PATCH_SHA256."
            sha256sum "$PATCH_ZIP"
            exit 1
          }

          echo "$ORIGINAL_SHA256  $ORIGINAL_ZIP" | sha256sum --check --status || {
            echo "ERROR: The downloaded original ZIP does not match the official v5.0.1 baseline checksum."
            sha256sum "$ORIGINAL_ZIP"
            exit 1
          }

          unzip -t "$PATCH_ZIP" >/dev/null
          unzip -t "$ORIGINAL_ZIP" >/dev/null
          mkdir -p "$PATCH_UNPACK" "$ORIGINAL_UNPACK"
          unzip -q "$PATCH_ZIP" -d "$PATCH_UNPACK"
          unzip -q "$ORIGINAL_ZIP" -d "$ORIGINAL_UNPACK"

          PATCH_ROOT="$(find "$PATCH_UNPACK" -mindepth 1 -maxdepth 1 -type d -print -quit)"
