name: EXPERIMENTAL - Android desktop zip with apps sync

# Takes YOUR latest release zip (scrcpy-win64-v5.0.1-android17.zip) and
# replaces only scrcpy-server with a build that also moves phone apps to the desktop.

on:
  workflow_dispatch:
    inputs:
      release_zip_url:
        description: 'Your latest release zip (the base to upgrade)'
        default: 'https://github.com/ommprakashswain/scrcpy-android17-desktop/releases/download/v5.0.1-android17-fix/scrcpy-win64-v5.0.1-android17.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OFFICIAL scrcpy v5.0.1 (source for the server)
        uses: actions/checkout@v4
        with:
          repository: Genymobile/scrcpy
          ref: v5.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Apply patch 1 (Android 17 virtual display launch fix)
        run: |
          cat > fix1.patch <<'PATCH1_EOF'
          diff --git a/server/src/main/java/com/genymobile/scrcpy/AndroidVersions.java b/server/src/main/java/com/genymobile/scrcpy/AndroidVersions.java
          index 5303924a..37574df3 100644
          --- a/server/src/main/java/com/genymobile/scrcpy/AndroidVersions.java
          +++ b/server/src/main/java/com/genymobile/scrcpy/AndroidVersions.java
          @@ -28,5 +28,6 @@ public final class AndroidVersions {
               public static final int API_33_ANDROID_13 = Build.VERSION_CODES.TIRAMISU;
               public static final int API_34_ANDROID_14 = Build.VERSION_CODES.UPSIDE_DOWN_CAKE;
               public static final int API_35_ANDROID_15 = Build.VERSION_CODES.VANILLA_ICE_CREAM;
          +    public static final int API_37_ANDROID_17 = 37;

           }
          diff --git a/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java b/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java
          index 5ed4c732..0d32cee1 100644
          --- a/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java
          +++ b/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java
          @@ -41,6 +41,7 @@ public class NewDisplayCapture extends SurfaceCapture {
               private static final int VIRTUAL_DISPLAY_FLAG_TOUCH_FEEDBACK_DISABLED = 1 << 13;
               private static final int VIRTUAL_DISPLAY_FLAG_OWN_FOCUS = 1 << 14;
               private static final int VIRTUAL_DISPLAY_FLAG_DEVICE_DISPLAY_GROUP = 1 << 15;
          +    private static final int VIRTUAL_DISPLAY_FLAG_ALLOWS_CONTENT_MODE_SWITCH = 1 << 17;

               private final VirtualDisplayListener vdListener;
               private final NewDisplay newDisplay;
          @@ -210,16 +211,21 @@ public class NewDisplayCapture extends SurfaceCapture {

               public void startNew(Surface surface) {
                   try {
          +            boolean contentModeSwitch = vdSystemDecorations && Build.VERSION.SDK_INT >= AndroidVersions.API_37_ANDROID_17;
          +
                       int flags = VIRTUAL_DISPLAY_FLAG_PUBLIC
                               | VIRTUAL_DISPLAY_FLAG_PRESENTATION
          -                    | VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY
                               | VIRTUAL_DISPLAY_FLAG_SUPPORTS_TOUCH
                               | VIRTUAL_DISPLAY_FLAG_ROTATES_WITH_CONTENT;
          +            if (!contentModeSwitch) {
          +                flags |= VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY;
          +            }
                       if (vdDestroyContent) {
                           flags |= VIRTUAL_DISPLAY_FLAG_DESTROY_CONTENT_ON_REMOVAL;
                       }
                       if (vdSystemDecorations) {
          -                flags |= VIRTUAL_DISPLAY_FLAG_SHOULD_SHOW_SYSTEM_DECORATIONS;
          +                flags |= contentModeSwitch ? VIRTUAL_DISPLAY_FLAG_ALLOWS_CONTENT_MODE_SWITCH
          +                        : VIRTUAL_DISPLAY_FLAG_SHOULD_SHOW_SYSTEM_DECORATIONS;
                       }
                       if (Build.VERSION.SDK_INT >= AndroidVersions.API_33_ANDROID_13) {
                           flags |= VIRTUAL_DISPLAY_FLAG_TRUSTED
          PATCH1_EOF
          git apply --check fix1.patch
          git apply fix1.patch

      - name: Apply patch 2 (EXPERIMENTAL - move phone apps to the desktop)
        run: |
          cat > fix2.patch <<'PATCH2_EOF'
          diff --git a/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java b/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java
          index 0d32cee1..22c98bf3 100644
          --- a/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java
          +++ b/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java
          @@ -17,6 +17,7 @@ import com.genymobile.scrcpy.opengl.OpenGLRunner;
           import com.genymobile.scrcpy.util.AffineMatrix;
           import com.genymobile.scrcpy.util.Ln;
           import com.genymobile.scrcpy.wrappers.ServiceManager;
          +import com.genymobile.scrcpy.wrappers.TaskMover;

           import android.graphics.Rect;
           import android.hardware.display.VirtualDisplay;
          @@ -247,6 +248,11 @@ public class NewDisplayCapture extends SurfaceCapture {
                           ServiceManager.getWindowManager().setDisplayImePolicy(virtualDisplayId, displayImePolicy);
                       }

          +            // Experimental: bring the apps open on the phone to the new display (only if enabled by the launcher script)
          +            if (TaskMover.isEnabled()) {
          +                TaskMover.moveAppsAsync(virtualDisplayId);
          +            }
          +
                       displayMonitor.start(virtualDisplayId, (props) -> {
                           int reason;
                           if (flexDisplay) {
          diff --git a/server/src/main/java/com/genymobile/scrcpy/wrappers/TaskMover.java b/server/src/main/java/com/genymobile/scrcpy/wrappers/TaskMover.java
          new file mode 100644
          index 00000000..1a46c107
          --- /dev/null
          +++ b/server/src/main/java/com/genymobile/scrcpy/wrappers/TaskMover.java
          @@ -0,0 +1,201 @@
          +package com.genymobile.scrcpy.wrappers;
          +
          +import com.genymobile.scrcpy.util.Ln;
          +
          +import android.annotation.SuppressLint;
          +import android.os.IInterface;
          +
          +import java.io.File;
          +import java.lang.reflect.Field;
          +import java.lang.reflect.InvocationTargetException;
          +import java.lang.reflect.Method;
          +import java.util.ArrayList;
          +import java.util.Collections;
          +import java.util.List;
          +
          +/**
          + * EXPERIMENTAL: move the apps currently open on the phone's main display to the new virtual display.
          + * <p>
          + * Enabled only if the marker file below exists on the device (created by the launcher script with adb). Everything is done by reflection on hidden
          + * Android APIs, so it can differ between Android versions: any failure is logged and ignored, it never breaks the mirroring.
          + * <p>
          + * Only "standard" apps (activity type 1) are moved: the home screen, recents and SystemUI are never touched.
          + */
          +@SuppressLint("PrivateApi,DiscouragedPrivateApi")
          +public final class TaskMover {
          +
          +    private static final String MARKER_FILE = "/data/local/tmp/scrcpy_move_apps";
          +
          +    private static final int DEFAULT_DISPLAY = 0;
          +    private static final int ACTIVITY_TYPE_STANDARD = 1;
          +    private static final int MAX_TASKS = 100;
          +    private static final long DELAY_MS = 1500;
          +
          +    private TaskMover() {
          +        /* not instantiable */
          +    }
          +
          +    public static boolean isEnabled() {
          +        return new File(MARKER_FILE).exists();
          +    }
          +
          +    /**
          +     * Move the apps in a background thread, after a short delay so that the new display is ready.
          +     */
          +    public static void moveAppsAsync(int targetDisplayId) {
          +        Thread thread = new Thread(() -> {
          +            try {
          +                Thread.sleep(DELAY_MS);
          +                moveApps(targetDisplayId);
          +            } catch (InterruptedException e) {
          +                Thread.currentThread().interrupt();
          +            } catch (Throwable e) {
          +                Ln.w("Could not move apps to the new display", e);
          +            }
          +        }, "move-apps");
          +        thread.setDaemon(true);
          +        thread.start();
          +    }
          +
          +    static void moveApps(int targetDisplayId) {
          +        IInterface atm = ServiceManager.getService("activity_task", "android.app.IActivityTaskManager");
          +
          +        List<?> tasks = getTasks(atm);
          +        if (tasks == null) {
          +            Ln.w("Could not list the running apps: not moving anything");
          +            return;
          +        }
          +
          +        List<Integer> taskIds = new ArrayList<>();
          +        int unknownType = 0;
          +        for (Object task : tasks) {
          +            Integer taskId = getIntField(task, "taskId");
          +            Integer displayId = getIntField(task, "displayId");
          +            Integer type = getActivityType(task);
          +            if (taskId == null) {
          +                continue;
          +            }
          +            if (type == null) {
          +                // Safety: if we can't tell what it is, never move it (it could be the home screen)
          +                unknownType++;
          +                continue;
          +            }
          +            if (displayId != null && displayId != DEFAULT_DISPLAY) {
          +                continue;
          +            }
          +            if (type == ACTIVITY_TYPE_STANDARD) {
          +                taskIds.add(taskId);
          +            }
          +        }
          +
          +        if (unknownType > 0) {
          +            Ln.w(unknownType + " task(s) skipped: unknown activity type");
          +        }
          +        if (taskIds.isEmpty()) {
          +            Ln.i("No app to move to the new display");
          +            return;
          +        }
          +
          +        Method moveMethod = findMoveMethod(atm);
          +        if (moveMethod == null) {
          +            Ln.w("Moving apps between displays is not supported by this Android version");
          +            return;
          +        }
          +
          +        // The list is sorted from the most recent to the oldest app: move the oldest first, so that the most recent app ends up on top
          +        Collections.reverse(taskIds);
          +
          +        int moved = 0;
          +        for (int taskId : taskIds) {
          +            try {
          +                moveMethod.invoke(atm, taskId, targetDisplayId);
          +                moved++;
          +            } catch (InvocationTargetException e) {
          +                Ln.w("Could not move task " + taskId, e.getCause() != null ? e.getCause() : e);
          +            } catch (ReflectiveOperationException e) {
          +                Ln.w("Could not move task " + taskId, e);
          +            }
          +        }
          +        Ln.i("Moved " + moved + "/" + taskIds.size() + " app(s) to display " + targetDisplayId);
          +    }
          +
          +    private static List<?> getTasks(IInterface atm) {
          +        List<Method> candidates = new ArrayList<>();
          +        for (Method method : atm.getClass().getMethods()) {
          +            if (method.getName().equals("getTasks")) {
          +                candidates.add(method);
          +            }
          +        }
          +        // The signature changed over Android versions: try the most recent (more parameters) first
          +        candidates.sort((a, b) -> b.getParameterTypes().length - a.getParameterTypes().length);
          +
          +        for (Method method : candidates) {
          +            Class<?>[] types = method.getParameterTypes();
          +            Object[] args = new Object[types.length];
          +            boolean firstInt = true;
          +            boolean supported = true;
          +            for (int i = 0; i < types.length; ++i) {
          +                if (types[i] == int.class) {
          +                    // first int: maxNum, next int: displayId
          +                    args[i] = firstInt ? MAX_TASKS : DEFAULT_DISPLAY;
          +                    firstInt = false;
          +                } else if (types[i] == boolean.class) {
          +                    args[i] = false;
          +                } else {
          +                    supported = false;
          +                    break;
          +                }
          +            }
          +            if (!supported) {
          +                continue;
          +            }
          +            try {
          +                Object result = method.invoke(atm, args);
          +                if (result instanceof List) {
          +                    return (List<?>) result;
          +                }
          +            } catch (ReflectiveOperationException | RuntimeException e) {
          +                Ln.d("getTasks variant failed: " + e);
          +            }
          +        }
          +        return null;
          +    }
          +
          +    private static Method findMoveMethod(IInterface atm) {
          +        // Android 12L+ / older name
          +        String[] names = {"moveRootTaskToDisplay", "moveStackToDisplay"};
          +        for (String name : names) {
          +            for (Method method : atm.getClass().getMethods()) {
          +                Class<?>[] types = method.getParameterTypes();
          +                if (method.getName().equals(name) && types.length == 2 && types[0] == int.class && types[1] == int.class) {
          +                    return method;
          +                }
          +            }
          +        }
          +        return null;
          +    }
          +
          +    private static Integer getActivityType(Object task) {
          +        Integer type = getIntField(task, "topActivityType");
          +        if (type != null) {
          +            return type;
          +        }
          +        // Fallback: task.configuration.windowConfiguration.getActivityType()
          +        try {
          +            Object configuration = task.getClass().getField("configuration").get(task);
          +            Object windowConfiguration = configuration.getClass().getField("windowConfiguration").get(configuration);
          +            return (Integer) windowConfiguration.getClass().getMethod("getActivityType").invoke(windowConfiguration);
          +        } catch (ReflectiveOperationException | RuntimeException e) {
          +            return null;
          +        }
          +    }
          +
          +    private static Integer getIntField(Object object, String name) {
          +        try {
          +            Field field = object.getClass().getField(name);
          +            return field.getInt(object);
          +        } catch (ReflectiveOperationException | RuntimeException e) {
          +            return null;
          +        }
          +    }
          +}
          PATCH2_EOF
          git apply --check fix2.patch
          git apply fix2.patch
          git --no-pager diff --stat

      # Both changes are in the SERVER (Java, runs on the phone).
      - name: Build scrcpy-server
        run: |
          export VERSION=v5.0.1
          release/build_server.sh
          ls -la release/work/build-server/server/scrcpy-server

      - name: Download YOUR latest release zip
        run: |
          curl -fsSL -o base.zip "${{ github.event.inputs.release_zip_url }}"
          mkdir base
          unzip -q base.zip -d base
          # find the folder that contains scrcpy.exe (works even if folders are nested)
          EXE=$(find base -name scrcpy.exe | head -n 1)
          test -n "$EXE" || (echo "scrcpy.exe not found in the release zip" && exit 1)
          DIR=$(dirname "$EXE")
          echo "Base folder: $DIR"
          echo "BASE_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Swap in the new server and add the SYNC launcher
        run: |
          cp release/work/build-server/server/scrcpy-server "$BASE_DIR/scrcpy-server"
          cat > "$BASE_DIR/Start-Android-Desktop-SYNC.bat" <<'BAT_EOF'
          @echo off
          title Android Desktop SYNC (experimental)

          REM === Always run from the folder this file is in ===
          cd /d "%~dp0"

          REM ===== EDIT THESE IF YOU WANT =====
          set SIZE=2560x1440
          set DPI=320
          set FPS=60
          set BITRATE=20M
          set KEYBOARD=--keyboard=uhid
          set IME=--display-ime-policy=hide
          set MOUSE=

          REM 1 = move the apps open on your phone to the desktop when it starts
          REM 0 = normal desktop (no moving)
          set SYNC_APPS=1
          REM ==================================

          if "%SYNC_APPS%"=="1" (
              adb.exe shell touch /data/local/tmp/scrcpy_move_apps
          ) else (
              adb.exe shell rm -f /data/local/tmp/scrcpy_move_apps
          )
          if errorlevel 1 (
              echo.
              echo Phone not found. Plug it in, turn on USB debugging and tap Allow.
              pause
              exit /b 1
          )

          echo Starting Android Desktop: %SIZE% / %DPI% dpi, %FPS% FPS, %BITRATE%
          echo Move phone apps to desktop: %SYNC_APPS%
          echo When you close this window, the apps go back to your phone.
          echo.

          REM --no-vd-destroy-content = apps go back to the phone when the desktop closes
          scrcpy.exe --new-display=%SIZE%/%DPI% --max-fps=%FPS% --video-bit-rate=%BITRATE% --no-vd-destroy-content %KEYBOARD% %IME% %MOUSE%

          if errorlevel 1 (
              echo.
              echo scrcpy stopped with an error. Read the message above.
              pause
          )
          BAT_EOF
          # Windows batch files need CRLF line endings
          sed -i 's/$/\r/' "$BASE_DIR/Start-Android-Desktop-SYNC.bat"
          mkdir -p out
          rm -rf out/scrcpy-win64-v5.0.1-android17-appsync
          cp -r "$BASE_DIR" out/scrcpy-win64-v5.0.1-android17-appsync
          (cd out && zip -qr ../scrcpy-win64-v5.0.1-android17-appsync-experimental.zip scrcpy-win64-v5.0.1-android17-appsync)
          unzip -l scrcpy-win64-v5.0.1-android17-appsync-experimental.zip

      - name: Upload final zip
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-win64-v5.0.1-android17-appsync-experimental
          path: scrcpy-win64-v5.0.1-android17-appsync-experimental.zip
          if-no-files-found: error
